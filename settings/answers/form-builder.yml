# Answers for a repository without .copier-answers.yml yet, in the same
# format. Delete this file once the repository is rendered from the template.
description: Define Formisch forms in JSON, render them with your own components, or compile them to typed Valibot code.
stack: typescript
kind: library
workspace: monorepo
publish: true
pages: true
# Settings only: the job names of today's ci.yml, until it calls the shared workflows.
required_checks:
  - check
  - valibot-min
  - react-18
  - adapters-min (react)
  - adapters-min (vue)
  - node-22
  - consumer-smoke-min
