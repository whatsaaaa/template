# Versions and publishes the packages of a pnpm project with changesets: on a push to main it
# opens or updates the Version Packages pull request, and once that is merged it packs the
# packages and publishes them to npm by trusted publishing (OIDC, with provenance). The caller is
# the project's own release.yml, the workflow npm's trusted publisher names:
#
#   on:
#     push:
#       branches: [main]
#   permissions: {}
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#   jobs:
#     release:
#       uses: whatsaaaa/template/.github/workflows/changesets-release.yml@v1
#       permissions:
#         actions: write # starts CI on the Version Packages pull request
#         contents: write # Version Packages pull request, git tags and GitHub releases
#         pull-requests: write # Version Packages pull request
#         id-token: write # npm OIDC
#
# The repository needs an `npm` environment (a required reviewer, branch policy main), "Allow
# GitHub Actions to create and approve pull requests", and a trusted publisher on npm for
# release.yml and the environment npm. Each package builds itself in its prepack script.
#
# GitHub starts no pull_request run for a pull request this workflow's token updates, so the
# version job starts the caller's CI workflow on the Version Packages branch instead, for the
# required checks. That workflow needs a `workflow_dispatch` trigger; pass its file name as
# `ci-workflow` when it is not ci.yml.
name: Changesets release

on:
  workflow_call:
    inputs:
      ci-workflow:
        description: File name of the CI workflow started on the Version Packages pull request
        type: string
        default: ci.yml

permissions: {}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      actions: write # starts CI on the Version Packages pull request
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # read by @changesets/changelog-github
      # GitHub starts no pull_request run for a pull request this workflow's token updates, so the
      # required CI check would never report on it. A workflow_dispatch it does start.
      - run: gh workflow run "$CI_WORKFLOW" --ref "changeset-release/$GITHUB_REF_NAME"
        env:
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      # prepack builds each package
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    # A calling job cannot set an environment, so it is set here. It must match the trusted
    # publisher on npm.
    environment: npm
    permissions:
      contents: write # git tags + GitHub releases
      id-token: write # npm OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup
        with:
          cache: false
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
